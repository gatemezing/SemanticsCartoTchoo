server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls (see frontend/src/api/client.ts's default empty
    # VITE_API_BASE_URL) are proxied to the backend container by its Docker
    # Compose service name.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A cold-cache SPARQL fetch (see backend SPARQL_TIMEOUT_MS, up to
        # 180s for the heaviest country) legitimately takes longer than
        # nginx's 60s default — confirmed live: this proxy 504'd a real,
        # eventually-successful France fetch without this.
        proxy_connect_timeout 200s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
    }

    # Client-side routing (viewport/entity URLs) — always fall back to
    # index.html rather than a 404 for a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
