server {
    # Unprivileged port: the image runs nginx as a non-root user, which
    # can't bind to ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Page-level security policy. Applies to every response below because
    # no location block sets its own add_header (that would replace, not
    # extend, these). HSTS belongs on the TLS-terminating proxy in front of
    # this container, which is where HTTPS is served.
    #
    # CSP: everything same-origin, except the basemap and OpenRailwayMap
    # tiles (MapLibre fetches raster tiles, so they need connect-src as
    # well as img-src) and MapLibre's worker, which is started from a blob:
    # URL. If the frontend is built with VITE_API_BASE_URL pointing at
    # another origin, add that origin to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tiles.openrailwaymap.org; connect-src 'self' https://tile.openstreetmap.org https://*.tiles.openrailwaymap.org; worker-src 'self' blob:; child-src blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Full URLs (which carry the selected entity) stay on this site; tile
    # servers only see the origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Same-origin API calls (see frontend/src/api/client.ts's default empty
    # VITE_API_BASE_URL) are proxied to the backend container by its Docker
    # Compose service name.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend trusts this (TRUST_PROXY in docker-compose.yml) to
        # rate-limit and log per real client rather than per proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold-cache SPARQL fetch (see backend SPARQL_TIMEOUT_MS, up to
        # 180s for the heaviest country) legitimately takes longer than
        # nginx's 60s default — confirmed live: this proxy 504'd a real,
        # eventually-successful France fetch without this.
        proxy_connect_timeout 200s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
    }

    # Built assets are real files or a 404 — never the SPA fallback below,
    # which once masked a missing MapLibre worker as "200 text/html".
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routing (viewport/entity URLs) — always fall back to
    # index.html rather than a 404 for a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
