name: Deploy frontend to GitHub Pages

# GitHub Pages only serves static files — it cannot run the Node/Fastify
# backend. This publishes the frontend build only. For it to actually work
# once live, a backend needs to be reachable somewhere (e.g. the Docker
# image in this repo, run on any host) and its URL set as the repository
# variable VITE_API_BASE_URL (Settings > Secrets and variables > Actions >
# Variables). Left unset, the build defaults to relative /api/... calls,
# which will 404 on Pages since there's no same-origin backend there.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "packages/shared-types/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@carto-rinf/shared-types
      - run: npm run build --workspace=frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
